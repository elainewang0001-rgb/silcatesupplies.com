<svg viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07101e"/>
      <stop offset="100%" stop-color="#0d2640"/>
    </linearGradient>
    <radialGradient id="cloud" cx="50%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sf"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="600" height="380" fill="url(#bg)"/>
  <!-- powder cloud glow -->
  <ellipse cx="300" cy="200" rx="180" ry="110" fill="url(#cloud)" filter="url(#sf)"/>
  <!-- scattered powder particles — larger ones -->
  <g fill="#e8f0f8">
    <circle cx="300" cy="190" r="14" opacity="0.95"/>
    <circle cx="270" cy="165" r="10" opacity="0.88"/>
    <circle cx="330" cy="168" r="11" opacity="0.86"/>
    <circle cx="252" cy="205" r="8" opacity="0.82"/>
    <circle cx="348" cy="208" r="9" opacity="0.80"/>
    <circle cx="280" cy="228" r="8" opacity="0.78"/>
    <circle cx="322" cy="224" r="7" opacity="0.76"/>
    <circle cx="300" cy="240" r="6" opacity="0.72"/>
  </g>
  <!-- medium particles -->
  <g fill="#c8d8f0" opacity="0.72">
    <circle cx="240" cy="180" r="6"/><circle cx="360" cy="182" r="6"/>
    <circle cx="260" cy="248" r="5"/><circle cx="340" cy="246" r="5"/>
    <circle cx="225" cy="215" r="5"/><circle cx="375" cy="218" r="5"/>
    <circle cx="290" cy="152" r="5"/><circle cx="312" cy="148" r="4"/>
    <circle cx="248" cy="135" r="4"/><circle cx="354" cy="137" r="4"/>
  </g>
  <!-- small flying particles -->
  <g fill="#a0b8d8" opacity="0.55">
    <circle cx="210" cy="195" r="3.5"/><circle cx="390" cy="197" r="3.5"/>
    <circle cx="220" cy="240" r="3"/><circle cx="382" cy="242" r="3"/>
    <circle cx="270" cy="115" r="3"/><circle cx="332" cy="112" r="3"/>
    <circle cx="195" cy="220" r="2.5"/><circle cx="405" cy="224" r="2.5"/>
    <circle cx="185" cy="175" r="2"/><circle cx="415" cy="178" r="2"/>
    <circle cx="240" cy="270" r="2.5"/><circle cx="360" cy="268" r="2.5"/>
    <circle cx="300" cy="280" r="3"/><circle cx="280" cy="110" r="2"/>
    <circle cx="180" cy="200" r="2"/><circle cx="420" cy="202" r="2"/>
  </g>
  <!-- tiny dust -->
  <g fill="#788fa8" opacity="0.45">
    <circle cx="160" cy="190" r="1.5"/><circle cx="440" cy="193" r="1.5"/>
    <circle cx="170" cy="240" r="1.5"/><circle cx="430" cy="238" r="1.5"/>
    <circle cx="300" cy="95" r="1.5"/><circle cx="260" cy="82" r="1.5"/>
    <circle cx="340" cy="80" r="1.5"/><circle cx="200" cy="160" r="1.5"/>
    <circle cx="400" cy="162" r="1.5"/>
  </g>
  <!-- formula text on top of center -->
  <text x="300" y="193" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="900" fill="#0d2640">Na₄SiO₄</text>
  <!-- alkalinity ring indicator -->
  <circle cx="300" cy="190" r="60" fill="none" stroke="#e8a020" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
  <circle cx="300" cy="190" r="90" fill="none" stroke="#e8a020" stroke-width="1" stroke-dasharray="4,6" opacity="0.2"/>
  <!-- top badge -->
  <rect x="165" y="14" width="270" height="26" rx="13" fill="#e8a020" opacity="0.18"/>
  <text x="300" y="31" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#e8a020" letter-spacing="1">HIGHEST ALKALINITY SILICATE</text>
  <!-- bottom name -->
  <text x="300" y="348" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#ffffff">Sodium Orthosilicate</text>
  <!-- spec pills -->
  <rect x="130" y="358" width="108" height="18" rx="9" fill="#0d2640"/>
  <text x="184" y="371" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#e8a020" font-weight="600">Na₂O ≥ 58.5%</text>
  <rect x="248" y="358" width="104" height="18" rx="9" fill="#0d2640"/>
  <text x="300" y="371" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#e8a020" font-weight="600">SiO₂ ≥ 27.5%</text>
  <rect x="362" y="358" width="108" height="18" rx="9" fill="#0d2640"/>
  <text x="416" y="371" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#e8a020" font-weight="600">Fe ≤ 0.005%</text>
</svg>
