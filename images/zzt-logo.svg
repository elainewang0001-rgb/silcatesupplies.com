<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0d2a47"/>
      <stop offset="100%" stop-color="#060f1a"/>
    </radialGradient>
    <radialGradient id="node-blue" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#90d8ff"/>
      <stop offset="100%" stop-color="#1a7abf"/>
    </radialGradient>
    <radialGradient id="node-gold" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#e8a020"/>
    </radialGradient>
    <!-- Clip to hexagon -->
    <clipPath id="hex-clip">
      <polygon points="150,12 264,78 264,210 150,276 36,210 36,78"/>
    </clipPath>
  </defs>

  <!-- Hexagon background -->
  <polygon points="150,12 264,78 264,210 150,276 36,210 36,78"
           fill="url(#bg-grad)"/>

  <!-- Everything clipped inside hexagon -->
  <g clip-path="url(#hex-clip)">

    <!-- Subtle molecular network in background (upper area) -->
    <!-- Bonds - very subtle -->
    <line x1="150" y1="80" x2="108" y2="104" stroke="#64d8ff" stroke-width="1" opacity="0.25"/>
    <line x1="150" y1="80" x2="192" y2="104" stroke="#64d8ff" stroke-width="1" opacity="0.25"/>
    <line x1="150" y1="80" x2="150" y2="112" stroke="#64d8ff" stroke-width="1" opacity="0.25"/>
    <line x1="108" y1="104" x2="76" y2="90" stroke="#64d8ff" stroke-width="1" opacity="0.18"/>
    <line x1="192" y1="104" x2="224" y2="90" stroke="#64d8ff" stroke-width="1" opacity="0.18"/>

    <!-- Outer nodes (Na) -->
    <circle cx="72" cy="87" r="8" fill="url(#node-blue)" opacity="0.35" filter="url(#glow)"/>
    <circle cx="228" cy="87" r="8" fill="url(#node-blue)" opacity="0.35" filter="url(#glow)"/>

    <!-- Mid nodes (O) -->
    <circle cx="106" cy="106" r="9" fill="url(#node-gold)" opacity="0.4" filter="url(#glow)"/>
    <circle cx="194" cy="106" r="9" fill="url(#node-gold)" opacity="0.4" filter="url(#glow)"/>
    <circle cx="150" cy="116" r="9" fill="url(#node-gold)" opacity="0.4" filter="url(#glow)"/>

    <!-- Center node (Si) - slightly more visible -->
    <circle cx="150" cy="76" r="14" fill="url(#node-blue)" opacity="0.5" filter="url(#glow)"/>
    <circle cx="150" cy="76" r="8" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

  </g>

  <!-- Hexagon border -->
  <polygon points="150,12 264,78 264,210 150,276 36,210 36,78"
           fill="none" stroke="#64d8ff" stroke-width="2" opacity="0.7" filter="url(#glow)"/>
  <polygon points="150,22 256,84 256,204 150,266 44,204 44,84"
           fill="none" stroke="#e8a020" stroke-width="0.8" opacity="0.3"/>

  <!-- ZZT — dominant foreground text -->
  <text x="150" y="200"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900"
        font-size="108"
        fill="#ffffff"
        text-anchor="middle"
        letter-spacing="-4"
        filter="url(#text-glow)">ZZT</text>

  <!-- INDUSTRIAL SUPPLIES -->
  <text x="150" y="228"
        font-family="Arial, sans-serif"
        font-size="13"
        fill="#64d8ff"
        text-anchor="middle"
        letter-spacing="3">INDUSTRIAL SUPPLIES</text>

</svg>
