<svg viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1e35"/>
      <stop offset="100%" stop-color="#1a3c5e"/>
    </linearGradient>
    <linearGradient id="crys" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c8ddf0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bg)"/>
  <!-- subtle background hex tiling -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1" fill="none">
    <polygon points="300,60 334,80 334,120 300,140 266,120 266,80"/>
    <polygon points="368,100 402,120 402,160 368,180 334,160 334,120"/>
    <polygon points="232,100 266,120 266,160 232,180 198,160 198,120"/>
    <polygon points="300,140 334,160 334,200 300,220 266,200 266,160"/>
    <polygon points="436,60 470,80 470,120 436,140 402,120 402,80"/>
    <polygon points="164,60 198,80 198,120 164,140 130,120 130,80"/>
    <polygon points="368,20 402,40 402,80 368,100 334,80 334,40"/>
    <polygon points="232,20 266,40 266,80 232,100 198,80 198,40"/>
    <polygon points="436,140 470,160 470,200 436,220 402,200 402,160"/>
    <polygon points="164,140 198,160 198,200 164,220 130,200 130,160"/>
    <polygon points="300,220 334,240 334,280 300,300 266,280 266,240"/>
  </g>
  <!-- center crystal cluster — 7-hex honeycomb -->
  <!-- center hex -->
  <polygon points="300,158 334,178 334,218 300,238 266,218 266,178" fill="url(#crys)" opacity="0.92"/>
  <!-- ring of 6 hexes -->
  <polygon points="300,78 334,98 334,138 300,158 266,138 266,98" fill="url(#crys)" opacity="0.78"/>
  <polygon points="368,118 402,138 402,178 368,198 334,178 334,138" fill="url(#crys)" opacity="0.72"/>
  <polygon points="368,198 402,218 402,258 368,278 334,258 334,218" fill="url(#crys)" opacity="0.68"/>
  <polygon points="300,238 334,258 334,298 300,318 266,298 266,258" fill="url(#crys)" opacity="0.65"/>
  <polygon points="232,198 266,218 266,258 232,278 198,258 198,218" fill="url(#crys)" opacity="0.68"/>
  <polygon points="232,118 266,138 266,178 232,198 198,178 198,138" fill="url(#crys)" opacity="0.72"/>
  <!-- hex outlines for depth -->
  <polygon points="300,158 334,178 334,218 300,238 266,218 266,178" fill="none" stroke="#7ab8e0" stroke-width="1.5" opacity="0.6"/>
  <polygon points="300,78 334,98 334,138 300,158 266,138 266,98" fill="none" stroke="#7ab8e0" stroke-width="1" opacity="0.5"/>
  <polygon points="368,118 402,138 402,178 368,198 334,178 334,138" fill="none" stroke="#7ab8e0" stroke-width="1" opacity="0.5"/>
  <polygon points="368,198 402,218 402,258 368,278 334,258 334,218" fill="none" stroke="#7ab8e0" stroke-width="1" opacity="0.5"/>
  <polygon points="300,238 334,258 334,298 300,318 266,298 266,258" fill="none" stroke="#7ab8e0" stroke-width="1" opacity="0.5"/>
  <polygon points="232,198 266,218 266,258 232,278 198,258 198,218" fill="none" stroke="#7ab8e0" stroke-width="1" opacity="0.5"/>
  <polygon points="232,118 266,138 266,178 232,198 198,178 198,138" fill="none" stroke="#7ab8e0" stroke-width="1" opacity="0.5"/>
  <!-- formula center -->
  <text x="300" y="202" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#1a3c5e">Na₂SiO₃</text>
  <!-- top badge -->
  <rect x="175" y="14" width="250" height="26" rx="13" fill="#e8a020" opacity="0.18"/>
  <text x="300" y="31" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#e8a020" letter-spacing="1">TOP 5 GLOBAL PRODUCER</text>
  <!-- bottom name -->
  <text x="300" y="348" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" fill="#ffffff">Sodium Metasilicate Anhydrous</text>
  <!-- spec pills -->
  <rect x="132" y="358" width="100" height="18" rx="9" fill="#0d2640"/>
  <text x="182" y="371" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#e8a020" font-weight="600">Na₂O 51%</text>
  <rect x="242" y="358" width="116" height="18" rx="9" fill="#0d2640"/>
  <text x="300" y="371" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#e8a020" font-weight="600">m.p. 1089°C</text>
  <rect x="368" y="358" width="100" height="18" rx="9" fill="#0d2640"/>
  <text x="418" y="371" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#e8a020" font-weight="600">pH 12.4</text>
</svg>
