<svg viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2a50"/>
      <stop offset="100%" stop-color="#1e4d7a"/>
    </linearGradient>
    <linearGradient id="crys" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8eeff"/>
      <stop offset="100%" stop-color="#8ec8f0"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4db8e0"/>
      <stop offset="100%" stop-color="#2080b8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bg)"/>
  <!-- subtle background rings -->
  <circle cx="300" cy="190" r="160" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.06"/>
  <circle cx="300" cy="190" r="130" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.06"/>
  <circle cx="300" cy="190" r="100" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.06"/>
  <!-- Central crystal: 8-pointed star shape -->
  <polygon points="300,110 318,172 380,190 318,208 300,270 282,208 220,190 282,172" fill="url(#crys)" opacity="0.88"/>
  <!-- inner star -->
  <polygon points="300,140 312,178 350,190 312,202 300,240 288,202 250,190 288,178" fill="#e8f8ff" opacity="0.95"/>
  <!-- star outline -->
  <polygon points="300,110 318,172 380,190 318,208 300,270 282,208 220,190 282,172" fill="none" stroke="#7ab8e0" stroke-width="1.5" opacity="0.6"/>
  <!-- 5 water molecule circles (H₂O) at each arm tip + 1 center-right -->
  <!-- top -->
  <circle cx="300" cy="88" r="18" fill="url(#water)" opacity="0.85"/>
  <text x="300" y="93" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff">H₂O</text>
  <!-- top-right -->
  <circle cx="392" cy="132" r="18" fill="url(#water)" opacity="0.82"/>
  <text x="392" y="137" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff">H₂O</text>
  <!-- bottom-right -->
  <circle cx="392" cy="248" r="18" fill="url(#water)" opacity="0.82"/>
  <text x="392" y="253" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff">H₂O</text>
  <!-- bottom-left -->
  <circle cx="208" cy="248" r="18" fill="url(#water)" opacity="0.82"/>
  <text x="208" y="253" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff">H₂O</text>
  <!-- top-left -->
  <circle cx="208" cy="132" r="18" fill="url(#water)" opacity="0.82"/>
  <text x="208" y="137" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff">H₂O</text>
  <!-- connector lines from star tips to water molecules -->
  <line x1="300" y1="110" x2="300" y2="106" stroke="#7ab8e0" stroke-width="1.5" opacity="0.5"/>
  <line x1="373" y1="145" x2="379" y2="139" stroke="#7ab8e0" stroke-width="1.5" opacity="0.5"/>
  <line x1="373" y1="235" x2="379" y2="241" stroke="#7ab8e0" stroke-width="1.5" opacity="0.5"/>
  <line x1="227" y1="235" x2="221" y2="241" stroke="#7ab8e0" stroke-width="1.5" opacity="0.5"/>
  <line x1="227" y1="145" x2="221" y2="139" stroke="#7ab8e0" stroke-width="1.5" opacity="0.5"/>
  <!-- formula in center -->
  <text x="300" y="185" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1a3c5e">Na₂SiO₃</text>
  <text x="300" y="200" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1a3c5e">·5H₂O</text>
  <!-- top badge -->
  <rect x="175" y="14" width="250" height="26" rx="13" fill="#e8a020" opacity="0.18"/>
  <text x="300" y="31" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#e8a020" letter-spacing="1">TOP 5 GLOBAL PRODUCER</text>
  <!-- bottom name -->
  <text x="300" y="346" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#ffffff">Sodium Metasilicate Pentahydrate</text>
  <!-- spec pills -->
  <rect x="130" y="356" width="100" height="18" rx="9" fill="#0d2640"/>
  <text x="180" y="369" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#e8a020" font-weight="600">Na₂O 28.7-30%</text>
  <rect x="240" y="356" width="120" height="18" rx="9" fill="#0d2640"/>
  <text x="300" y="369" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#e8a020" font-weight="600">m.p. 72.2°C</text>
  <rect x="370" y="356" width="100" height="18" rx="9" fill="#0d2640"/>
  <text x="420" y="369" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#e8a020" font-weight="600">MW 212</text>
</svg>
