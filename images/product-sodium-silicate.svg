<svg viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#082840"/>
      <stop offset="100%" stop-color="#0d4060"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2090c8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d5080" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38b8e8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a78a8" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#80d8f8"/>
      <stop offset="100%" stop-color="#1890c8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bg)"/>
  <!-- background flow lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1" fill="none">
    <path d="M0,80 Q150,60 300,80 Q450,100 600,80"/>
    <path d="M0,130 Q150,110 300,130 Q450,150 600,130"/>
    <path d="M0,300 Q150,280 300,300 Q450,320 600,300"/>
    <path d="M0,350 Q150,330 300,350 Q450,370 600,350"/>
  </g>
  <!-- liquid surface / wave layers -->
  <path d="M0,260 Q75,240 150,255 Q225,270 300,250 Q375,230 450,248 Q525,266 600,252 L600,380 L0,380 Z" fill="url(#wave1)"/>
  <path d="M0,280 Q80,265 160,278 Q240,290 320,272 Q400,254 480,270 Q540,282 600,268 L600,380 L0,380 Z" fill="url(#wave2)"/>
  <!-- container vessel outline -->
  <rect x="210" y="100" width="180" height="220" rx="12" fill="none" stroke="#80c8e8" stroke-width="2" opacity="0.4"/>
  <rect x="216" y="100" width="168" height="10" rx="5" fill="#80c8e8" opacity="0.3"/>
  <!-- liquid inside container -->
  <rect x="212" y="200" width="176" height="118" rx="8" fill="#1880b8" opacity="0.6"/>
  <path d="M212,195 Q255,182 300,195 Q345,208 388,195 L388,204 Q345,218 300,204 Q255,190 212,204 Z" fill="#2090c8" opacity="0.7"/>
  <!-- surface shimmer lines -->
  <line x1="230" y1="220" x2="370" y2="220" stroke="#80d8f8" stroke-width="1" opacity="0.4"/>
  <line x1="230" y1="240" x2="370" y2="240" stroke="#80d8f8" stroke-width="1" opacity="0.3"/>
  <!-- big droplet above container -->
  <path d="M300,55 Q315,90 320,115 Q322,130 300,135 Q278,130 280,115 Q285,90 300,55Z" fill="url(#drop)" opacity="0.9"/>
  <!-- droplet reflection -->
  <ellipse cx="292" cy="90" rx="4" ry="10" fill="white" opacity="0.25" transform="rotate(-20,292,90)"/>
  <!-- grade labels -->
  <text x="300" y="235" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#c8eeff" opacity="0.9">LGY401 / LGY402 / LGY403</text>
  <text x="300" y="252" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#c8eeff" opacity="0.7">LGY501 · LGY33</text>
  <!-- top badge -->
  <rect x="180" y="14" width="240" height="26" rx="13" fill="#e8a020" opacity="0.18"/>
  <text x="300" y="31" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#e8a020" letter-spacing="1">5 STANDARD GRADES</text>
  <!-- bottom name -->
  <text x="300" y="348" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#ffffff">Sodium Silicate Liquid</text>
  <!-- spec pills -->
  <rect x="128" y="358" width="110" height="18" rx="9" fill="#082840"/>
  <text x="183" y="371" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#e8a020" font-weight="600">M.R. 1.30 – 3.40</text>
  <rect x="248" y="358" width="104" height="18" rx="9" fill="#082840"/>
  <text x="300" y="371" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#e8a020" font-weight="600">Baumé 32.5 – 51°</text>
  <rect x="362" y="358" width="110" height="18" rx="9" fill="#082840"/>
  <text x="417" y="371" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#e8a020" font-weight="600">Water Glass</text>
</svg>
